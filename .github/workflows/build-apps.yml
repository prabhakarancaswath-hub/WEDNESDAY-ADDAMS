name: Build Wednesday apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'package.json', 'electron/**', 'capacitor.config.ts', '.github/workflows/build-apps.yml']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: python -m pip install pillow
      - run: python scripts/generate-icons.py
      - run: npm run build
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with: { name: Wednesday-Windows-Installer, path: release/*.exe, if-no-files-found: error }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: python -m pip install pillow
      - run: python scripts/generate-icons.py
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Wednesday-Android-APK, path: android/app/build/outputs/apk/debug/*.apk, if-no-files-found: error }